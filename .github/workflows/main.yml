name: Test and Deploy Lambda Functions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: pytest tests/ -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Register function
        run: |
          cd lambda_functions/register
          zip -r function.zip lambda_function.py
          aws lambda update-function-code --function-name EventRegAndTicketing-Register --zip-file fileb://function.zip

      - name: Deploy ListEvents function
        run: |
          cd lambda_functions/list_events
          zip -r function.zip lambda_function.py
          aws lambda update-function-code --function-name EventRegAndTicketing-ListEvents --zip-file fileb://function.zip

      - name: Deploy GetRegistrations function
        run: |
          cd lambda_functions/get_registrations
          zip -r function.zip lambda_function.py
          aws lambda update-function-code --function-name EventRegAndTicketing-GetRegistrations --zip-file fileb://function.zip

      - name: Deploy CancelRegistration function
        run: |
          cd lambda_functions/cancel_registration
          zip -r function.zip lambda_function.py
          aws lambda update-function-code --function-name EventRegAndTicketing-CancelRegistration --zip-file fileb://function.zip
